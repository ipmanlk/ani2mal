name: ci

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.x
          # Caches the Deno deps dir, keyed on a hash of deno.lock.
          cache: true
      - run: deno install --frozen
      - run: deno task lint
      - run: deno task fmt:check
      - run: deno task check
      - name: Domain purity
        run: |
          if grep -R -E "from ['\"]node:|import.*node:" src/domain; then echo "✖ domain imports node:"; exit 1; fi
          echo "✓ domain purity ok"
      - run: deno task test:coverage
      - run: deno task compile
      - run: ./dist/ani2mal --version
      - run: ./dist/ani2mal --help
      - name: No-token dry-run stays actionable
        run: ANI2MAL_CONFIG_DIR=/tmp/ci-test ./dist/ani2mal sync --dry-run 2>&1 | grep -q "anilist.username"
